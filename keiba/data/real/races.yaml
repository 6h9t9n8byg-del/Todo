# 実在の大レース結果（手作業で収集・出典付き）
#
# 収集方法: Web検索の結果から、レース名・施行日・上位入線馬を読み取って記録した。
# この実行環境では JRA / netkeiba / JBIS へ直接アクセスできない（ネットワーク
# ポリシーで遮断される）ため、検索結果の要約を根拠にしている。したがって
#
#   * 上位3着まで、または1着だけしか判明していないレースがある
#   * 出走全頭・タイム・オッズは含まれていない
#   * 検索要約の読み取り誤りが混入しうる
#
# 実運用の前に sources の URL で必ず裏を取ること。JRA-VAN などの正規データを
# 入手できるなら、そちらを keiba/schema.py の形式で読み込む方が精度は高い。
#
# result: 判明している入線順。先頭が1着。ここに挙がっていない馬は「不明」であって
#         「負けた」ではない。レーティングもその前提で（判明分の順序だけを）使う。

meta:
  collected: 2026-07-28
  method: web_search
  note: 上位入線のみ。全出走馬・タイム・オッズは未取得。

