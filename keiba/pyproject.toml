[project]
name = "keiba"
version = "0.1.0"
description = "レース単位の確率モデルとオッズブレンドによる競馬予想システム"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.scripts]
keiba = "keiba.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keiba*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
